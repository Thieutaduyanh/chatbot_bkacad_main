services:
  - type: web
    name: chatbot-bkacad
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port 10000"
envVars:
  - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
    value: ${GOOGLE_APPLICATION_CREDENTIALS_JSON} # sử dụng biến env từ Render dashboard

